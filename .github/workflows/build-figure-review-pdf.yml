name: Build figure review PDF

on:
  push:
    branches:
      - chatgpt-temp-figure-review-pdf-20260906
    paths:
      - figure_review/build_figure_review_pdf.py
      - .github/workflows/build-figure-review-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pypdf pymupdf pillow

      - name: Build PDF
        run: python figure_review/build_figure_review_pdf.py

      - name: Validate and render PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          from pypdf import PdfReader

          pdf = Path('figure_review/output/Helix_LP_OAM_Figure_Issue_Checklist_CN.pdf')
          assert pdf.exists() and pdf.stat().st_size > 100_000, pdf
          reader = PdfReader(str(pdf))
          assert len(reader.pages) >= 15, len(reader.pages)
          doc = fitz.open(pdf)
          check_dir = Path('figure_review/output/qa')
          check_dir.mkdir(parents=True, exist_ok=True)
          for page_index in sorted({0, 1, len(doc)//2, len(doc)-1}):
              page = doc[page_index]
              pix = page.get_pixmap(matrix=fitz.Matrix(1.2, 1.2), alpha=False)
              pix.save(check_dir / f'page_{page_index+1:02d}.png')
          print({'pages': len(reader.pages), 'bytes': pdf.stat().st_size})
          PY
          pdffonts figure_review/output/Helix_LP_OAM_Figure_Issue_Checklist_CN.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-figure-review-pdf
          path: |
            figure_review/output/Helix_LP_OAM_Figure_Issue_Checklist_CN.pdf
            figure_review/output/qa/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated PDF to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figure_review/output/Helix_LP_OAM_Figure_Issue_Checklist_CN.pdf
          if git diff --cached --quiet; then
            echo 'No PDF change to commit.'
          else
            git commit -m 'Build figure review PDF'
            git push
          fi
