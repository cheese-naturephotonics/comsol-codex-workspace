name: Build revised Section 2

on:
  push:
    branches:
      - chatgpt-section2-revised-20260906
    paths:
      - 'paper_section2/第二节_统一有限箱体多模与旋转对称选模理论_修订版.md'
      - '.github/workflows/build-section2-revised.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-section2-revised-20260906
          fetch-depth: 0

      - name: Apply source-level build corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('paper_section2/第二节_统一有限箱体多模与旋转对称选模理论_修订版.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              r'\nu_n^{(R)}(R_{\max},\phi)=0.',
              r'u_n^{(R)}(R_{\max},\phi)=0.',
              1,
          )
          text = text.replace(
              r'\usepackage{amsmath,amssymb,mathtools,bm,booktabs,longtable,array}',
              r'\usepackage{amsmath,amssymb,mathtools,booktabs,longtable,array,mathrsfs}',
              1,
          )
          text = text.replace(
              r'\usepackage{amsmath,amssymb,mathtools,bm,booktabs,longtable,array,mathrsfs}',
              r'\usepackage{amsmath,amssymb,mathtools,booktabs,longtable,array,mathrsfs}',
              1,
          )
          old_lab = (
              '实验室坐标中的完整场由共旋转系数和冻结本征模先重构，再施加完整横截面旋转：\n\n'
              '$$\n'
              '|\\Psi_{\\mathrm{lab}}(z)\\rangle\n'
              '=e^{i\\beta_{\\mathrm{ref}}z}R[\\vartheta(z)]\n'
              '\\sum_n c_n(z)|u_n^{(R)}\\rangle .\n'
              '$$'
          )
          new_lab = (
              '忽略公共参考传播相位时，实验室坐标中的完整场由共旋转系数和冻结本征模先重构，再施加完整横截面旋转：\n\n'
              '$$\n'
              '|\\Psi_{\\mathrm{lab}}(z)\\rangle\n'
              '=R[\\vartheta(z)]\n'
              '\\sum_n c_n(z)|u_n^{(R)}\\rangle .\n'
              '$$'
          )
          if old_lab in text:
              text = text.replace(old_lab, new_lab, 1)
          text = text.replace(r'\boldsymbol{\sigma}', r'\symbf{\sigma}')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pandoc texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-fonts-recommended fonts-noto-cjk poppler-utils

      - name: Convert Markdown to standalone LaTeX
        run: |
          cd paper_section2
          pandoc '第二节_统一有限箱体多模与旋转对称选模理论_修订版.md' \
            --from=markdown+tex_math_dollars+raw_tex \
            --to=latex \
            --standalone \
            --pdf-engine=xelatex \
            --variable colorlinks=true \
            --variable linkcolor=blue \
            --variable urlcolor=blue \
            --metadata title='' \
            --output='第二节_统一有限箱体多模与旋转对称选模理论_修订版.tex'

      - name: Compile PDF
        run: |
          cd paper_section2
          xelatex -interaction=nonstopmode -halt-on-error \
            '第二节_统一有限箱体多模与旋转对称选模理论_修订版.tex'
          xelatex -interaction=nonstopmode -halt-on-error \
            '第二节_统一有限箱体多模与旋转对称选模理论_修订版.tex'

      - name: Basic PDF validation
        run: |
          cd paper_section2
          test -s '第二节_统一有限箱体多模与旋转对称选模理论_修订版.pdf'
          pdfinfo '第二节_统一有限箱体多模与旋转对称选模理论_修订版.pdf'
          pdftotext '第二节_统一有限箱体多模与旋转对称选模理论_修订版.pdf' extracted.txt
          grep -q '统一有限箱体多模' extracted.txt
          grep -q '精确有限箱体共旋转多模' extracted.txt
          grep -q 'u_n' '第二节_统一有限箱体多模与旋转对称选模理论_修订版.md'
          grep -q '忽略公共参考传播相位时' '第二节_统一有限箱体多模与旋转对称选模理论_修订版.md'
          rm -f extracted.txt

      - name: Commit corrected Markdown, generated LaTeX and PDF
        run: |
          git config user.name 'ChatGPT Artifact Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            'paper_section2/第二节_统一有限箱体多模与旋转对称选模理论_修订版.md' \
            'paper_section2/第二节_统一有限箱体多模与旋转对称选模理论_修订版.tex' \
            'paper_section2/第二节_统一有限箱体多模与旋转对称选模理论_修订版.pdf'
          if git diff --cached --quiet; then
            echo 'No generated-file changes to commit.'
          else
            git commit -m 'Build corrected revised Section 2 artifacts'
            git push origin HEAD:chatgpt-section2-revised-20260906
          fi

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: revised-section2-md-tex-pdf
          path: |
            paper_section2/第二节_统一有限箱体多模与旋转对称选模理论_修订版.md
            paper_section2/第二节_统一有限箱体多模与旋转对称选模理论_修订版.tex
            paper_section2/第二节_统一有限箱体多模与旋转对称选模理论_修订版.pdf
          if-no-files-found: error
